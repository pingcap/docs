name: Translation Cron JA

concurrency:
  # Do not manually dispatch this workflow while a scheduled run is in progress.
  group: translation-ja-${{ github.event_name }}
  cancel-in-progress: true

on:
  schedule:
    # Runs JA translation at 00:30 every Thursday (Beijing time, UTC+8)
    - cron: "30 16 * * 3"
  workflow_dispatch:
    inputs:
      translation_scope:
        description: "Choose whether to translate all updated files or only specified files"
        required: true
        type: choice
        default: Translate all updated files
        options:
          - Translate all updated files
          - Translate only specified files
      file_names:
        description: "Required for specified files: paths to translate (comma-separated)"
        required: false
        type: string
      source_files_translation_mode:
        description: "For specified files only: translate incrementally or as full files"
        required: true
        type: choice
        default: incremental
        options:
          - incremental
          - full

env:
  PRODUCT: TiDB
  SOURCE_REPO: pingcap/docs
  SOURCE_BRANCH: release-8.5
  TERMS_BRANCH: master
  JA_BRANCH: i18n-ja-release-8.5
  TOC_FILES: TOC.md,TOC-ai.md,TOC-api.md,TOC-best-practices.md,TOC-develop.md,TOC-tidb-releases.md,TOC-tidb-cloud.md,TOC-tidb-cloud-starter.md,TOC-tidb-cloud-starter-postgresql.md,TOC-tidb-cloud-essential.md,TOC-tidb-cloud-premium.md,TOC-tidb-cloud-byoc.md,TOC-tidb-cloud-releases.md,TOC-tidb-cloud-lake.md,TOC-tidb-cloud-filesystem.md
  # Exclude specified doc files from specified TOC files after Japanese translation.
  TOC_EXCLUSIONS: >-
    {
      "tidb-cloud-log-redaction.md": [
        "TOC-tidb-cloud.md",
        "TOC-tidb-cloud-premium.md",
        "TOC-tidb-cloud-byoc.md"
      ]
    }
  # Seed Japanese titles for groups excluded before their translations were recorded.
  TOC_EXCLUSION_GROUP_TRANSLATIONS: '{"Data Access Control": "データアクセス制御"}'
  INDEX_FILES: _index.md,ai/_index.md,api/_index.md,best-practices/_index.md,develop/_index.md,releases/_index.md,tidb-cloud/dedicated/_index.md,tidb-cloud/essential/_index.md,tidb-cloud/premium/_index.md,tidb-cloud/byoc/_index.md,tidb-cloud/releases/_index.md,tidb-cloud/starter/_index.md,tidb-cloud-lake/_index.md,tidb-cloud-filesystem/_index.md
  AI_TRANSLATOR_REPO: qiancai/ai-markdown-translator
  AI_TRANSLATOR_REF: c52e9188383f8a2d7056a072da63310e8346a001 # main
  # Manual all-updated runs use the same global cursor behavior as scheduled runs.
  COMMIT_SYNC_RUN_TYPE: ${{ (github.event_name == 'schedule' || inputs.translation_scope == 'Translate all updated files') && 'schedule' || 'workflow_dispatch' }}

permissions: {}

jobs:
  authorize:
    uses: ./.github/workflows/authorize-privileged-workflow.yml
    permissions:
      actions: read

  translate-ja:
    needs: authorize
    # Use Re-run all jobs so authorization runs again for the new attempt.
    if: needs.authorize.outputs.attempt == github.run_attempt
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Validate manual inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TRANSLATION_SCOPE: ${{ inputs.translation_scope }}
          INPUT_FILE_NAMES: ${{ inputs.file_names }}
          SOURCE_FILES_TRANSLATION_MODE: ${{ inputs.source_files_translation_mode }}
        run: |
          set -euo pipefail
          case "${TRANSLATION_SCOPE}" in
            "Translate all updated files")
              if [ -n "${INPUT_FILE_NAMES//[[:space:]]/}" ]; then
                echo "file_names must be empty when translation_scope is 'Translate all updated files'." >&2
                exit 1
              fi
              if [ "${SOURCE_FILES_TRANSLATION_MODE}" != "incremental" ]; then
                echo "source_files_translation_mode must be 'incremental' when translation_scope is 'Translate all updated files'." >&2
                exit 1
              fi
              ;;
            "Translate only specified files")
              if [ -z "${INPUT_FILE_NAMES//[[:space:]]/}" ]; then
                echo "file_names is required when translation_scope is 'Translate only specified files'." >&2
                exit 1
              fi
              ;;
          esac

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        name: Checkout docs target branch
        with:
          ref: ${{ env.JA_BRANCH }}
          path: docs
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        name: Checkout docs source branch
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_BRANCH }}
          path: docs-source
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        name: Checkout docs terms branch
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.TERMS_BRANCH }}
          path: docs-terms
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        name: Checkout ai-markdown-translator
        with:
          repository: ${{ env.AI_TRANSLATOR_REPO }}
          ref: ${{ env.AI_TRANSLATOR_REF }}
          path: ai-markdown-translator
          persist-credentials: false

      - name: Checkout translation dependency lock
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: workflow-dependencies
          sparse-checkout: scripts/ai-translator-requirements.lock
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        name: Setup Python
        with:
          python-version: "3.9.25"
          cache: pip
          cache-dependency-path: workflow-dependencies/scripts/ai-translator-requirements.lock

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: \
            -r workflow-dependencies/scripts/ai-translator-requirements.lock

      - name: Resolve commit range
        id: commits
        shell: bash
        working-directory: docs
        run: |
          set -euo pipefail

          readarray -t cursor_values < <(python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("latest_translation_commit.json").read_text(encoding="utf-8"))
          print((data.get("target") or "").strip())
          print((data.get("sha") or "").strip())
          PY
          )

          cursor_target="${cursor_values[0]:-}"
          base_ref="${cursor_values[1]:-}"
          head_ref="$(git -C "${GITHUB_WORKSPACE}/docs-source" rev-parse HEAD)"

          if [ -z "${base_ref}" ]; then
            echo "latest_translation_commit.json does not contain a source sha" >&2
            exit 1
          fi

          if [ -n "${cursor_target}" ] && [ "${cursor_target}" != "${SOURCE_BRANCH}" ]; then
            echo "latest_translation_commit.json target is ${cursor_target}, expected ${SOURCE_BRANCH}" >&2
            exit 1
          fi

          echo "base_ref=${base_ref}" >> "${GITHUB_OUTPUT}"
          echo "head_ref=${head_ref}" >> "${GITHUB_OUTPUT}"

      - name: Resolve source file filter
        id: source_files
        shell: bash
        env:
          INPUT_FILE_NAMES: ${{ github.event_name == 'workflow_dispatch' && inputs.translation_scope == 'Translate only specified files' && inputs.file_names || '' }}
          BASE_REF: ${{ steps.commits.outputs.base_ref }}
          HEAD_REF: ${{ steps.commits.outputs.head_ref }}
          DOCS_SOURCE_PATH: ${{ github.workspace }}/docs-source
          DOCS_TARGET_PATH: ${{ github.workspace }}/docs
          TOC_FILES: ${{ env.TOC_FILES }}
          INDEX_FILES: ${{ env.INDEX_FILES }}
        run: |
          set -euo pipefail
          python ai-markdown-translator/scripts/resolve_cloud_source_files.py

      - name: Restore excluded TOC entries temporarily
        id: prepare_tocs
        if: steps.source_files.outputs.has_source_changes == 'true'
        shell: bash
        env:
          BASE_REF: ${{ steps.commits.outputs.base_ref }}
          DOCS_SOURCE_PATH: ${{ github.workspace }}/docs-source
          DOCS_TARGET_PATH: ${{ github.workspace }}/docs
          SOURCE_FILES: ${{ steps.source_files.outputs.files }}
          SOURCE_FILES_TRANSLATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.translation_scope == 'Translate only specified files' && inputs.source_files_translation_mode || 'incremental' }}
          TOC_EXCLUSIONS: ${{ env.TOC_EXCLUSIONS }}
          TOC_EXCLUSION_GROUP_TRANSLATIONS: ${{ env.TOC_EXCLUSION_GROUP_TRANSLATIONS }}
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/translation-toc-exclusions.py" <<'PY'
          """Restore configured TOC exclusions for translation, then remove them again."""

          import json
          import os
          import re
          import subprocess
          import sys
          from functools import lru_cache
          from pathlib import Path


          def parse_nodes(lines):
              nodes = []
              stack = []
              for index, line in enumerate(lines):
                  heading = re.match(r"^(#{1,6})\s+", line)
                  item = re.match(r"^( *)-\s+(.*)", line)
                  if heading:
                      stack.clear()
                      nodes.append((index, ("heading", len(heading[1])), None, None))
                  elif item:
                      indent = len(item[1])
                      while stack and stack[-1][0] >= indent:
                          stack.pop()
                      parent = stack[-1][1] if stack else None
                      link = re.match(r"\[.*?\]\(([^)]+)\)", item[2])
                      key = ("link", indent, link[1]) if link else ("group", indent)
                      nodes.append((index, key, parent, item[2]))
                      stack.append((indent, len(nodes) - 1))
              return nodes


          def excluded_nodes(lines, nodes, files, empty_group_titles=()):
              patterns = [
                  re.compile(r"\]\(\s*(?:[^)\s]*/)?" + re.escape(name) + r"(?:#[^)\s]*)?\s*\)")
                  for name in files
              ]
              removed = {
                  i for i, node in enumerate(nodes)
                  if any(pattern.search(lines[node[0]]) for pattern in patterns)
              }
              children = {}
              for i, node in enumerate(nodes):
                  if node[2] is not None:
                      children.setdefault(node[2], []).append(i)
              # A known excluded group can already be empty if English removed its link.
              removed.update(i for i, node in enumerate(nodes)
                             if node[1][0] == "group" and not children.get(i)
                             and node[3] in empty_group_titles)
              # Remove only plain list groups made empty by these exclusions.
              for i in reversed(range(len(nodes))):
                  if (nodes[i][1][0] == "group" and children.get(i)
                          and all(child in removed for child in children[i])):
                      removed.add(i)
              return removed


          def remove_exclusions(content, files, empty_group_titles=()):
              lines = content.splitlines(keepends=True)
              nodes = parse_nodes(lines)
              removed_lines = {nodes[i][0] for i in excluded_nodes(lines, nodes, files, empty_group_titles)}
              return "".join(line for i, line in enumerate(lines) if i not in removed_lines)


          def restore_exclusions(source, target, files, group_translations):
              source_lines = source.splitlines(keepends=True)
              target_lines = target.splitlines(keepends=True)
              source_nodes = parse_nodes(source_lines)
              target_nodes = parse_nodes(target_lines)
              optional = excluded_nodes(source_lines, source_nodes, files, group_translations)
              if not optional:
                  return target

              # The remaining source and target structure must agree. Only configured
              # exclusions may be absent; never guess across unrelated structural drift.
              sys.setrecursionlimit(max(1000, 3 * (len(source_nodes) + len(target_nodes))))

              @lru_cache(None)
              def align(i, j):
                  if i == len(source_nodes):
                      return int(j == len(target_nodes))
                  count = align(i + 1, j) if i in optional else 0
                  if j < len(target_nodes) and source_nodes[i][1] == target_nodes[j][1]:
                      count += align(i + 1, j + 1)
                  return min(count, 2)

              if align(0, 0) != 1:
                  raise ValueError("Cannot uniquely align TOC with English BASE after configured exclusions")

              inserts = {}
              i = j = 0
              while i < len(source_nodes):
                  if i in optional and align(i + 1, j):
                      node = source_nodes[i]
                      line = source_lines[node[0]]
                      if node[1][0] == "group":
                          # This title can survive cleanup if HEAD adds another child.
                          translated = group_translations.get(node[3])
                          if not translated:
                              raise ValueError(f"Missing Japanese translation for restored group: {node[3]}")
                          line = " " * node[1][1] + "- " + translated + "\n"
                      position = target_nodes[j][0] if j < len(target_nodes) else len(target_lines)
                      inserts.setdefault(position, []).append(line.rstrip("\r\n") + "\n")
                  else:
                      j += 1
                  i += 1

              result = []
              for position in range(len(target_lines) + 1):
                  if position in inserts:
                      if result and not result[-1].endswith(("\n", "\r")):
                          result[-1] += "\n"
                      result.extend(inserts[position])
                  if position < len(target_lines):
                      result.append(target_lines[position])
              return "".join(result)


          def remember_group_translations(source, target, files, group_translations=None):
              source_lines = source.splitlines(keepends=True)
              source_nodes = parse_nodes(source_lines)
              target_nodes = parse_nodes(target.splitlines(keepends=True))
              if [node[1] for node in source_nodes] != [node[1] for node in target_nodes]:
                  # A failed or partial sync can leave the target at BASE. Do not label
                  # those old translations with HEAD group titles.
                  return {}
              removed = excluded_nodes(source_lines, source_nodes, files, group_translations or {})
              return {
                  source_nodes[i][3]: target_nodes[i][3]
                  for i in removed if source_nodes[i][1][0] == "group"
              }


          def effective_toc_base(content, toc_file, global_base, cursor, run_type):
              # Match the pinned translator: file markers override the global
              # cursor, and scheduled retries use their persisted baseline.
              marker = re.search(
                  r"<!--\s*Corresponding EN commit:\s*([0-9a-fA-F]{7,64})\s*-->", content
              )
              base = marker[1] if marker else global_base
              if run_type in ("schedule", "scheduled"):
                  pending = cursor.get("pending") or {}
                  retry = pending.get(toc_file) if isinstance(pending, dict) else None
                  if isinstance(retry, str) and re.fullmatch(r"[0-9a-fA-F]{7,64}", retry.strip()):
                      base = retry.strip()
              return base


          def main():
              mode = sys.argv[1]
              if mode not in ("prepare", "cleanup"):
                  raise ValueError("Expected prepare or cleanup")
              exclusions = json.loads(os.environ["TOC_EXCLUSIONS"])
              if not isinstance(exclusions, dict) or not exclusions:
                  raise ValueError("TOC_EXCLUSIONS must be a non-empty JSON object")
              translations = json.loads(os.environ.get("TOC_EXCLUSION_GROUP_TRANSLATIONS", "{}"))
              selected = set(filter(None, os.environ.get("SOURCE_FILES", "").split(",")))
              by_toc = {}
              for name, toc_files in exclusions.items():
                  if not isinstance(toc_files, list) or not toc_files:
                      raise ValueError(f"TOC exclusion for {name} must list at least one TOC")
                  for toc_file in toc_files:
                      by_toc.setdefault(toc_file, []).append(name)

              updates = []
              target_root = Path(os.environ["DOCS_TARGET_PATH"])
              cursor_path = target_root / "latest_translation_commit.json"
              cursor = json.loads(cursor_path.read_text(encoding="utf-8"))
              remembered = cursor.get("toc_exclusion_group_translations", {})
              original_remembered = json.dumps(remembered, sort_keys=True)
              for toc_file, files in by_toc.items():
                  target_path = target_root / toc_file
                  if not target_path.is_file():
                      continue
                  original = target_path.read_text(encoding="utf-8")
                  group_translations = {**translations, **remembered.get(toc_file, {})}
                  if mode == "prepare":
                      if (toc_file not in selected
                              or os.environ.get("SOURCE_FILES_TRANSLATION_MODE") == "full"):
                          continue
                      source_root = os.environ["DOCS_SOURCE_PATH"]
                      base = effective_toc_base(
                          original, toc_file, os.environ["BASE_REF"], cursor,
                          os.environ.get("COMMIT_SYNC_RUN_TYPE", ""),
                      )
                      subprocess.run(["git", "-C", source_root, "cat-file", "-e", base], check=True)
                      snapshot = subprocess.run(
                          ["git", "-C", source_root, "show", f"{base}:{toc_file}"],
                          capture_output=True, text=True, encoding="utf-8",
                      )
                      if snapshot.returncode:
                          # New TOCs have no BASE and use the normal full translation path.
                          print(f"No BASE TOC for {toc_file}; skipping temporary restoration")
                          continue
                      try:
                          updated = restore_exclusions(
                              snapshot.stdout, original, files,
                              group_translations,
                          )
                      except ValueError as error:
                          raise ValueError(f"{toc_file}: {error}") from error
                  else:
                      snapshot = subprocess.run(
                          ["git", "-C", os.environ["DOCS_SOURCE_PATH"], "show",
                           f"{os.environ['HEAD_REF']}:{toc_file}"],
                          capture_output=True, text=True, encoding="utf-8",
                      )
                      if (snapshot.returncode == 0 and toc_file in selected
                              and os.environ.get("SYNC_OUTCOME") == "success"):
                          group_titles = remember_group_translations(snapshot.stdout, original, files, group_translations)
                          if group_titles:
                              remembered.setdefault(toc_file, {}).update(group_titles)
                      updated = remove_exclusions(original, files, group_translations.values())
                  if updated != original:
                      updates.append((target_path, updated))

              # Validate every TOC before writing so an alignment failure leaves no partial preparation.
              for target_path, updated in updates:
                  target_path.write_text(updated, encoding="utf-8")
                  print(f"{mode}: updated {target_path.name}")
              if mode == "cleanup" and json.dumps(remembered, sort_keys=True) != original_remembered:
                  cursor["toc_exclusion_group_translations"] = remembered
                  cursor_path.write_text(json.dumps(cursor, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")


          if __name__ == "__main__":
              main()
          PY
          python "${RUNNER_TEMP}/translation-toc-exclusions.py" prepare

      - name: Run commit sync workflow
        id: sync
        if: steps.source_files.outputs.has_source_changes == 'true'
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
          SOURCE_REPO: ${{ env.SOURCE_REPO }}
          TARGET_REPO: ${{ env.SOURCE_REPO }}
          SOURCE_BRANCH: ${{ env.SOURCE_BRANCH }}
          SOURCE_BASE_REF: ${{ steps.commits.outputs.base_ref }}
          SOURCE_HEAD_REF: ${{ steps.commits.outputs.head_ref }}
          SOURCE_FOLDER: ""
          SOURCE_FILES: ${{ steps.source_files.outputs.files }}
          SOURCE_FULL_FILES: ${{ steps.source_files.outputs.full_files }}
          SOURCE_FILES_TRANSLATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.translation_scope == 'Translate only specified files' && inputs.source_files_translation_mode || 'incremental' }}
          SOURCE_LANGUAGE: English
          TARGET_LANGUAGE: Japanese
          TOC_FILES: ${{ env.TOC_FILES }}
          IGNORE_RESOURCE_CARD_SECTION: "Yes"
          SOURCE_REPO_PATH: ${{ github.workspace }}/docs-source
          TARGET_REF: ${{ env.JA_BRANCH }}
          PREFER_LOCAL_TARGET_FOR_READ: "true"
          TARGET_REPO_PATH: ${{ github.workspace }}/docs
          AI_PROVIDER: azure
          TERMS_PATH: ${{ github.workspace }}/docs-terms/resources/terms-en-ja.md
          FAIL_ON_TRANSLATION_ERROR: "true"
        run: |
          set -euo pipefail
          cd ai-markdown-translator/scripts
          python commit_sync_workflow.py

      - name: Post-process translated TOCs
        id: cleanup_tocs
        if: always() && steps.prepare_tocs.outcome == 'success'
        shell: bash
        env:
          DOCS_SOURCE_PATH: ${{ github.workspace }}/docs-source
          HEAD_REF: ${{ steps.commits.outputs.head_ref }}
          SOURCE_FILES: ${{ steps.source_files.outputs.files }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          DOCS_TARGET_PATH: ${{ github.workspace }}/docs
          TOC_EXCLUSIONS: ${{ env.TOC_EXCLUSIONS }}
          TOC_EXCLUSION_GROUP_TRANSLATIONS: ${{ env.TOC_EXCLUSION_GROUP_TRANSLATIONS }}
        run: |
          set -euo pipefail
          python "${RUNNER_TEMP}/translation-toc-exclusions.py" cleanup

      - name: Prepare translated changes
        id: changes
        if: always() && steps.cleanup_tocs.outcome == 'success'
        shell: bash
        working-directory: docs
        env:
          HEAD_REF: ${{ steps.commits.outputs.head_ref }}
          SOURCE_BRANCH: ${{ env.SOURCE_BRANCH }}
          FAILURE_REPORT: ${{ github.workspace }}/ai-markdown-translator/scripts/temp_output/translation-failures.md
        run: |
          set -euo pipefail

          if [ -s "${FAILURE_REPORT}" ]; then
            {
              echo "failure_summary<<EOF"
              cat "${FAILURE_REPORT}"
              echo
              echo "> Before merging this PR, manually translate the failed files above or start a new manual workflow run with translation_scope set to 'Translate only specified files' and file_names set to those paths."
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Intentionally advance the cursor even on partial sync failure.
          # Most files are translated successfully; failed files are listed in the PR body so reviewers can manually translate or rerun them with the specified-files scope and file_names. Do NOT gate this on sync outcome.
          if [ "${COMMIT_SYNC_RUN_TYPE}" = "schedule" ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("latest_translation_commit.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data.update(target=os.environ["SOURCE_BRANCH"], sha=os.environ["HEAD_REF"])
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          else
            echo "Skipping source cursor advancement for ${COMMIT_SYNC_RUN_TYPE} run."
          fi

          echo "has_changes=true" >> "${GITHUB_OUTPUT}"

      - name: Set build metadata
        id: build_meta
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          echo "date=$(TZ=Asia/Shanghai date +'%Y-%m-%d')" >> "${GITHUB_OUTPUT}"
          echo "id=$(TZ=Asia/Shanghai date +'%Y%m%d')-$(date +%s)" >> "${GITHUB_OUTPUT}"

      - name: Create PR
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          path: docs
          token: ${{ github.token }}
          branch: ja-translation/${{ steps.build_meta.outputs.id }}
          base: ${{ env.JA_BRANCH }}
          title: "${{ env.JA_BRANCH }}: translate doc changes from ${{ env.SOURCE_REPO }} ${{ env.SOURCE_BRANCH }} on ${{ steps.build_meta.outputs.date }}"
          labels: |
            translation/no-need
          body: |
            ### What is changed, added or deleted? (Required)

            Translate documentation changes from `pingcap/docs` `${{ env.SOURCE_BRANCH }}` to Japanese via `ai-markdown-translator` commit-diff sync.

            English commit diff:

            https://github.com/${{ env.SOURCE_REPO }}/compare/${{ steps.commits.outputs.base_ref }}...${{ steps.commits.outputs.head_ref }}

            ### Which TiDB version(s) do your changes apply to? (Required)

            - [x] ${{ env.JA_BRANCH }}

            ### What is the related PR or file link(s)?

            - Source repo: `${{ env.SOURCE_REPO }}`
            - Source branch: `${{ env.SOURCE_BRANCH }}`
            - TOCs: `${{ env.TOC_FILES }}`
            - Source files: `${{ steps.source_files.outputs.files }}`
            - Source files translation mode: `${{ github.event_name == 'workflow_dispatch' && inputs.translation_scope == 'Translate only specified files' && inputs.source_files_translation_mode || 'incremental' }}`
            - Sync outcome: `${{ steps.sync.outcome }}`

            ${{ steps.changes.outputs.failure_summary }}

            ### Do your changes match any of the following descriptions?

            - [ ] Delete files
            - [ ] Change aliases
            - [ ] Need modification after applied to another branch
            - [ ] Might cause conflicts after applied to another branch
          delete-branch: true
