name: Trigger docs site update

on:
  push:
    paths-ignore:
      - ".github/**"
    branches:
      - master
      - release-7.2
      - release-7.1
      - release-7.0
      - release-6.5
      - release-6.1
      - release-5.4
      - release-5.3
      - release-5.2
      - release-5.1
      - release-5.0
      - release-4.0
      - release-3.0
      - i18n-zh-release-8.5

permissions: {}

jobs:
  trigger:
    if: github.repository == 'pingcap/docs'
    runs-on: ubuntu-latest

    steps:
      - name: Extract sha
        id: extract
        shell: bash
        run: |
          echo "sha=$(sha=${{ github.sha }}; echo ${sha:0:6})" >> $GITHUB_OUTPUT

      - name: trigger docs-staging workflow
        env:
          GH_TOKEN: ${{ secrets.DOCS_STAGING }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          gh api \
            --method POST \
            repos/pingcap/docs-staging/actions/workflows/update.yml/dispatches \
            -f ref=main \
            -f 'inputs[full]=false' \
            -f "inputs[repo]=$SOURCE_REPO" \
            -f "inputs[branch]=$SOURCE_BRANCH"

      - name: trigger docs-staging nextgen workflow
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.DOCS_STAGING }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          gh api \
            --method POST \
            repos/pingcap/docs-staging/actions/workflows/update-nextgen.yml/dispatches \
            -f ref=nextgen \
            -f 'inputs[full]=false' \
            -f "inputs[repo]=$SOURCE_REPO" \
            -f "inputs[branch]=$SOURCE_BRANCH"
