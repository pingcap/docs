name: Summary Frontmatter

on:
  pull_request:
    paths:
      - "*.md"
      - "**/*.md"
      - "scripts/check-summary-frontmatter.py"
      - "scripts/test-check-summary-frontmatter.py"
      - ".github/workflows/check-summary-frontmatter.yaml"

jobs:
  check-summary-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python3 -m pip install PyYAML==6.0.2

      - name: Test frontmatter checker
        run: python3 scripts/test-check-summary-frontmatter.py

      - name: Check summary frontmatter
        run: python3 scripts/check-summary-frontmatter.py .
