name: ci / external-links-in-changed-lines (pull_request)

on:
  pull_request:

env:
  DOCS_SITE_BASE_URL: "https://docs.pingcap.com"

permissions:
  contents: read

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Collect changed markdown lines with links
        id: changed-lines
        run: |
          # Keep generated files outside the PR checkout and its symlinks.
          link_check_temp=$(mktemp -d "$RUNNER_TEMP/link-check.XXXXXXXXXX")
          echo "temp_dir=$link_check_temp" >> "$GITHUB_OUTPUT"

          git -c core.quotePath=false diff --unified=0 --diff-filter=AM --no-ext-diff --no-color HEAD^1 HEAD -- '*.md' |
            perl .github/scripts/extract-changed-markdown-lines.pl "$link_check_temp/changed-lines" "$link_check_temp/inputs.txt"

          count=$(wc -l < "$link_check_temp/inputs.txt" | tr -d ' ')
          echo "count=${count}" >> "$GITHUB_OUTPUT"

          if [ "$count" -gt 0 ]; then
            echo "has_inputs=true" >> "$GITHUB_OUTPUT"
            sed 's/^/- /' "$link_check_temp/inputs.txt"
          else
            echo "has_inputs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect doc site href URLs
        if: ${{ steps.changed-lines.outputs.has_inputs == 'true' }}
        env:
          LINK_CHECK_TEMP: ${{ steps.changed-lines.outputs.temp_dir }}
        run: |
          tr '\n' '\0' < "$LINK_CHECK_TEMP/inputs.txt" |
            perl .github/scripts/extract-site-hrefs.pl "$LINK_CHECK_TEMP/site-hrefs" "$LINK_CHECK_TEMP/site-href-files.txt"

          count=$(wc -l < "$LINK_CHECK_TEMP/site-href-files.txt" | tr -d ' ')
          if [ "$count" -gt 0 ]; then
            cat "$LINK_CHECK_TEMP/site-href-files.txt" >> "$LINK_CHECK_TEMP/inputs.txt"
            sed 's/^/- /' "$LINK_CHECK_TEMP/site-href-files.txt"
          fi

      - name: Link Checker
        if: ${{ steps.changed-lines.outputs.has_inputs == 'true' }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          fail: true
          failIfEmpty: false
          args: --root-dir "$(pwd)" --exclude '^file://' -E -i -n -t 45 --files-from "$LINK_CHECK_TEMP/inputs.txt"
          output: ${{ steps.changed-lines.outputs.temp_dir }}/report.md
        env:
          LINK_CHECK_TEMP: ${{ steps.changed-lines.outputs.temp_dir }}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
